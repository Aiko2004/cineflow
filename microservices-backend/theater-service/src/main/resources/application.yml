server:
  port: 8082

spring:
  application:
    name: theater-service
  data:
    web:
      pageable:
        max-page-size: 100
        default-page-size: 20
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${THEATER_DB_NAME:theater}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      # Flyway владеет схемой; Hibernate только сверяет сущности со схемой и падает при
      # расхождении. Больше НЕ update — схема управляется миграциями (V1 baseline).
      ddl-auto: validate
    open-in-view: false
  flyway:
    # На существующей БД (таблицы от прежнего ddl-auto: update, flyway_schema_history нет)
    # Flyway пометит текущее состояние как baseline v1 и НЕ выполнит V1 — данные сохранятся.
    # На пустой БД (свежий том) схема НЕ считается непустой → baseline не срабатывает,
    # выполняется V1 и создаёт таблицы. Один конфиг работает в обоих случаях.
    baseline-on-migrate: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # Публичные ключи auth-service. Spring кеширует их и перезапрашивает при
          # неизвестном kid — ротация ключей не требует перезапуска этого сервиса.
          jwk-set-uri: ${JWKS_URI:http://localhost:8084/.well-known/jwks.json}
  jackson:
    # Jackson 3: фича переехала в EnumFeature → ключ spring.jackson.datatype.enum.*
    # (старый .deserialization.* ломал старт приложения).
    datatype:
      enum:
        # Незнакомое значение enum (например, SeatType, добавленный в более новой
        # версии contracts) смапится в UNKNOWN вместо падения десериализации.
        read-unknown-enum-values-using-default-value: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/