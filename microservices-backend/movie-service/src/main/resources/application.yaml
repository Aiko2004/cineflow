server:
  port: 8081

spring:
  application:
    name: movie-service
  data:
    web:
      pageable:
        # Клиент не может запросить больше 100 элементов за раз.
        # Защита от случайного или намеренного "?size=999999".
        max-page-size: 100
        default-page-size: 20
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${MOVIE_DB_NAME:movies}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      # validate: Hibernate сверяет сущности со схемой при старте и падает,
      # если они расходятся. Flyway управляет схемой — ddl-auto не должен её трогать.
      ddl-auto: validate
    open-in-view: false
  flyway:
    # Для существующей БД без flyway_schema_history (управлялась ddl-auto: update):
    # установить baseline-on-migrate: true и baseline-version: 1.
    # Flyway пометит текущее состояние как V1 и начнёт применять с V2.
    baseline-on-migrate: false
  security:
    oauth2:
      resourceserver:
        jwt:
          # Публичные ключи auth-service. Spring кеширует их и перезапрашивает при
          # неизвестном kid — ротация ключей не требует перезапуска этого сервиса.
          jwk-set-uri: ${JWKS_URI:http://localhost:8084/.well-known/jwks.json}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
