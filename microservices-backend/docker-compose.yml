services:
  mongo:
    image: mongo:7
    container_name: mongo-cineflow
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
      MONGO_INITDB_DATABASE: screening
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  # Postgres — общий инстанс для сервисов на реляционной БД (movie, theater, auth, booking, payment).
  # Логические БД создаёт companion-сервис postgres-init (см. ниже) — на КАЖДЫЙ up,
  # идемпотентно. Скрипт из docker-entrypoint-initdb.d здесь НЕ используется: он отрабатывает
  # только при первой инициализации тома, поэтому на существующем томе недостающая БД
  # не создавалась и её приходилось добавлять руками.
  postgres:
    image: postgres:16
    container_name: postgres-cineflow
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      # Host-порт переопределяемый: на машине с уже установленным нативным PostgreSQL
      # порт 5432 занят, и localhost:5432 у приложения попадёт в него, а не в контейнер.
      # Тогда: DB_HOST_PORT=5433 (в .env) + DB_PORT=5433 у сервисов.
      - "${DB_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  # Создаёт недостающие логические БД на КАЖДЫЙ `docker compose up` — независимо от того,
  # свежий том или существующий. Скрипт идемпотентен (CREATE DATABASE только если ещё нет),
  # поэтому повторные запуски безопасны. Контейнер отрабатывает и завершается (restart: no).
  # Подключается к postgres по внутренней сети (host = имя сервиса), host-порт неважен.
  postgres-init:
    image: postgres:16
    container_name: postgres-init-cineflow
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - ./docker/postgres-init:/init:ro
    entrypoint:
      - psql
      - -h
      - postgres
      - -U
      - ${DB_USER:-postgres}
      - -v
      - ON_ERROR_STOP=1
      - -f
      - /init/01-create-databases.sql
    restart: "no"

  # Redis — OTP-коды (Hash с TTL) и счётчики rate limit для auth-service.
  redis:
    image: redis:7-alpine
    container_name: redis-cineflow
    ports:
      # Тот же приём, что и с postgres: при нативном Redis на 6379 задать
      # REDIS_HOST_PORT=6380 + REDIS_PORT=6380 у сервисов.
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data

  # Kafka — единственный брокер, режим KRaft (контроллер и брокер в одном процессе, без
  # ZooKeeper). Официальный образ apache/kafka; тег закреплён (4.3.1 — последний GA на
  # момент написания, остальные в списке тегов — RC), `latest` не используем.
  #
  # Два listener'а: приложения на хосте ходят на EXTERNAL (localhost:KAFKA_HOST_PORT),
  # контейнеры (kafka-ui) — на INTERNAL (kafka:19092). Брокер при подключении клиента
  # возвращает ADVERTISED-адрес, и клиент дальше идёт именно по нему, а не по тому адресу,
  # с которого начал. Поэтому advertised EXTERNAL обязан совпадать с host-портом:
  # при KAFKA_HOST_PORT=9094 он тоже 9094, иначе клиент подключится и тут же «потеряет» брокер.
  #
  # Автосоздание топиков выключено: опечатка в имени топика должна падать, а не молча
  # создавать новый топик с дефолтами. Топики объявляет payment-service (NewTopic-бины).
  kafka:
    image: apache/kafka:4.3.1
    container_name: kafka-cineflow
    ports:
      - "${KAFKA_HOST_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: EXTERNAL://:9092,INTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: EXTERNAL://localhost:${KAFKA_HOST_PORT:-9092},INTERNAL://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # Без этого брокер пишет данные в /tmp внутри контейнера, и том kafka_data ниже
      # остаётся пустым: топики и сообщения пропадают при пересоздании контейнера
      # (docker compose up после смены окружения). Путь — тот, что подготовлен в образе
      # (владелец appuser), поэтому именованный том получает правильные права.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Один брокер: реплицировать некуда, дефолт 3 не даст создать служебные топики.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Без задержки первой ребалансировки consumer group стартует сразу (dev).
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  # Web-интерфейс для обучения: топики, партиции, сообщения, consumer groups.
  # Только dev. Конфиг кластера задан переменными, UI без собственного хранилища.
  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    container_name: kafka-ui-cineflow
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "${KAFKA_UI_HOST_PORT:-8090}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: cineflow
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092

volumes:
  mongo_data:
  postgres_data:
  redis_data:
  kafka_data:
