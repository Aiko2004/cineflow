name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'microservices-backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'microservices-backend/**'
      - '.github/workflows/backend-ci.yml'

# Cancel an in-progress run when a new commit is pushed to the same ref.
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Testcontainers uses the Docker daemon preinstalled on ubuntu-latest runners.
      # No secrets needed: the build and tests run on in-code defaults.
      - name: Build
        working-directory: microservices-backend
        run: ./gradlew build --no-daemon

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          if-no-files-found: ignore
          retention-days: 7
